<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>react-native-shared-hero</title>
  <defs>
    <linearGradient id="heroGrad" x1="6" y1="56" x2="58" y2="8" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1" />
      <stop offset="0.55" stop-color="#818CF8" />
      <stop offset="1" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="cardSurface" x1="26" y1="8" x2="58" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818CF8" />
      <stop offset="1" stop-color="#38BDF8" />
    </linearGradient>
  </defs>
  <!-- Source card (bottom-left) -->
  <rect
    x="6"
    y="38"
    width="18"
    height="18"
    rx="4.5"
    stroke="url(#heroGrad)"
    stroke-width="2.5"
    stroke-dasharray="3 2.5"
    fill="#6366F1"
    fill-opacity="0.16"
  />
  <!-- Mid-flight ghost frame -->
  <rect
    x="16"
    y="23"
    width="23"
    height="23"
    rx="6.5"
    stroke="url(#heroGrad)"
    stroke-width="2"
    stroke-opacity="0.55"
    fill="#818CF8"
    fill-opacity="0.18"
  />
  <!-- Destination hero card (top-right) -->
  <rect
    x="28"
    y="6"
    width="30"
    height="30"
    rx="9"
    fill="url(#cardSurface)"
  />
  <!-- Inner mountain/sun graphic inside destination hero -->
  <circle cx="37.5" cy="15.5" r="3" fill="#0F172A" fill-opacity="0.75" />
  <path
    d="M31 31l7.5-9 5.5 6 4-4.5 7 7.5H31z"
    fill="#0F172A"
    fill-opacity="0.75"
  />
  <!-- Curved motion arc from source center to destination -->
  <path
    d="M15 47C15 26 24 17 41 19"
    stroke="#F59E0B"
    stroke-width="2.75"
    stroke-linecap="round"
  />
  <path
    d="M37.5 15.5L42.5 19L37.5 22.5"
    stroke="#F59E0B"
    stroke-width="2.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
